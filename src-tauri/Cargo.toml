# freally-teleprompt — the Tauri v2 app crate (shell, scroll engine, settings, EULA, i18n bridge).
[package]
name = "freally-teleprompt"
description = "Freally Teleprompt — a local-first, cross-platform teleprompter (Tauri v2 shell)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Resolves the per-OS config + data directories (settings.json, crash reports).
directories = { workspace = true }
# Timestamps a crash report in local time (with its offset) and in UTC.
chrono = { workspace = true }
# The native "stopped unexpectedly" box the `--crash-notice` helper shows.
rfd = { workspace = true }
# The LAN mirror's per-session key (FT-12).
getrandom = { workspace = true }
# Document import (FT-M01). Used only inside the `--import` child process —
# see the workspace manifest for why that isolation is not optional.
zip = { workspace = true }
quick-xml = { workspace = true }
pulldown-cmark = { workspace = true }
pdf-extract = { workspace = true }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Global hotkeys (FT-M13). Desktop-only by construction, which this app is.
tauri-plugin-global-shortcut = "2"
# Microphone capture and resampling for dictation. Depended on for its `cpal`
# backend only — the crate's own model-free command recogniser is not used by
# the app, which has no voice commands.
freally-voice = { path = "../freally-voice", features = ["capture-cpal"] }
# Dictation's recogniser (FT-32/FT-33). Always present for its capability check;
# the Vosk engine behind it links a native library, so that lives behind the
# off-by-default `vosk` feature — CI and the standard build need no libvosk.
freally-speech = { path = "../freally-speech" }

[features]
# Turn on the Vosk-backed dictation engine. OFF by default: enable it only where
# the native `libvosk` library and a model are present (a release build, FT-52).
# Without it the app builds cleanly and reports dictation unavailable rather
# than failing.
vosk = ["freally-speech/vosk"]

# The crash-notice helper waits for the crashed process to leave the process
# table before relaunching; the probe is the one thing with no portable std API.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
